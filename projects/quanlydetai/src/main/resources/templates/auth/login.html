<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
  <div class="container" style="max-width:400px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center text-primary">Quản lý đề tài sinh viên</h1>
        <p th:if="${param.error}" class="alert alert-danger">Sai tài khoản hoặc mật khẩu.</p>
        <p th:if="${param.logout}" class="alert alert-success">Đã đăng xuất.</p>
        <form method="post" th:action="@{/login}">
          <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>
        <p class="text-muted small mt-3 mb-0">Tài khoản test: sv01 / gv01 / truongkhoa / admin — mật khẩu: 123456</p>
      </div>
    </div>
  </div>
</body>
</html>
